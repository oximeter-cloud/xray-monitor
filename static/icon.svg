<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e131f"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#primary)" stroke-width="3" stroke-opacity="0.25"/>

  <!-- Radar Grid Circles -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#6366f1" stroke-width="2" stroke-opacity="0.12" stroke-dasharray="6 6"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="#6366f1" stroke-width="2" stroke-opacity="0.2"/>
  <circle cx="256" cy="256" r="60" fill="none" stroke="#6366f1" stroke-width="2" stroke-opacity="0.3"/>

  <!-- Crosshair axes -->
  <line x1="256" y1="64" x2="256" y2="448" stroke="#6366f1" stroke-width="2" stroke-opacity="0.15"/>
  <line x1="64" y1="256" x2="448" y2="256" stroke="#6366f1" stroke-width="2" stroke-opacity="0.15"/>

  <!-- Dynamic Signal / Telemetry Waveform -->
  <path d="M 100 256 L 160 256 L 195 160 L 230 330 L 265 210 L 295 285 L 325 240 L 355 256 L 412 256"
        fill="none" stroke="url(#cyanGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- Core Pulsing Nodes -->
  <circle cx="195" cy="160" r="10" fill="#a5f3fc" filter="url(#glow)"/>
  <circle cx="230" cy="330" r="10" fill="#a5f3fc" filter="url(#glow)"/>
  <circle cx="265" cy="210" r="12" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="295" cy="285" r="9" fill="#a5f3fc" filter="url(#glow)"/>
  <circle cx="325" cy="240" r="8" fill="#a5f3fc" filter="url(#glow)"/>
</svg>
